# Midnight city — English-only lock screen.
general {
    hide_cursor = true
}
background {
    monitor =
    path = ~/.local/share/arch-dotfiles/wallpaper.png
    blur_passes = 2
    blur_size = 3
    brightness = 0.78
}
label {
    monitor =
    text = S E S S I O N   L O C K E D
    color = rgba(cbd9e5bb)
    font_family = Adwaita Sans
    font_size = 10
    position = 0, -65
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f1f5f9ff)
    font_family = Adwaita Sans
    font_size = 112
    position = 0, -105
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] LC_ALL=C date +"%A, %B %d"
    color = rgba(d5e1ebdd)
    font_family = Adwaita Sans
    font_size = 18
    position = 0, -285
    halign = center
    valign = top
}
label {
    monitor =
    text = $USER
    color = rgba(e4edf5ee)
    font_family = Adwaita Sans
    font_size = 18
    position = 0, 245
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 300, 54
    outline_thickness = 1
    inner_color = rgba(101d2bba)
    outer_color = rgba(c3d7e54d)
    check_color = rgba(9fc9e8ff)
    fail_color = rgba(e9a19aff)
    font_color = rgba(e4edf5ff)
    font_family = Adwaita Sans
    fade_on_empty = false
    rounding = 27
    placeholder_text = <span foreground="##b8c8d7">Enter password</span>
    check_text = Verifying...
    fail_text = Incorrect password. Try again.
    capslock_color = rgba(e8c58aff)
    dots_size = 0.22
    dots_spacing = 0.35
    position = 0, 170
    halign = center
    valign = bottom
}
label {
    monitor =
    text = Press Enter to unlock
    color = rgba(b8c8d799)
    font_family = Adwaita Sans
    font_size = 11
    position = 0, 130
    halign = center
    valign = bottom
}
